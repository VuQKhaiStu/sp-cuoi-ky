<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/chung.css">
    <link rel="stylesheet" href="../css/dangki.css">
</head>

<body>

    <main>
        <div class="tao-tai-khoan">
            <div class="logo">
                <img src="../assets/icons/graduation-cap.png" alt="graduation-cap">
                <h1>EDUKA</h1>
            </div>
            <h3>Tạo tài khoản mới</h3>
            <p>Tham gia cộng động EDUKA để học hỏi, chia sẻ<br> và phát triển cùng nhau!</p>
            <form id="form-dang-ki">
                <div class="icon">
                    <img src="../assets/icons/nguoidung.png" alt="nguoidung">
                    <input type="text" placeholder="Tên đăng nhập" id="name-account">
                </div>
                <div class="icon">
                    <img src="../assets/icons/email.png" alt="email">
                    <input type="email" placeholder="Email" id="email">
                </div>
                <div class="icon">
                    <img src="../assets/icons/khoa.png" alt="matkhau">
                    <input type="password" placeholder="Mật khẩu" id="password">
                </div>
                <div class="icon">
                    <img src="../assets/icons/khoa.png" alt="xacnhanmatkhau">
                    <input type="password" placeholder="Xác nhận mật khẩu" id="confirm-password">
                </div>
                <button type="submit">Đăng ký</button>
            </form>
            <p class="dang-nhap">Đã có tài khoản? <a href="dangnhap.html">Đăng nhập</a></p>
        </div>
        <div id="dang-ki-thanh-cong" class="thong-bao-dang-ki">
            <div class="hop-thong-bao">
                <h3>Đăng ký thành công!</h3>
                <p>Tài khoản của bạn đã được tạo thành công.</p>
                <a href="dangnhap.html">Đăng nhập ngay!!!</a>
            </div>
        </div>
        <div id="thieu-thong-tin" class="thong-bao-dang-ki">
            <div class="hop-thong-bao">
                <h3>
                    Thông báo!!!
                </h3>
                <p>Vui lòng nhập đủ thông tin!!!</p>
                <button type="button" class="btn-dong-thong-bao">Đóng</button>
            </div>
        </div>
    </main>
    <script src="../js/dangki.js"></script>
</body>

</html>
