<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/chung.css">
    <link rel="stylesheet" href="../css/dangki.css">
</head>
<body>
   
   <main>
    <div class="tao-tai-khoan">
        <div class="logo">
            <img src="../assets/icons/graduation-cap.png" alt="graduation-cap">
            <h1>EDUKA</h1>
        </div>
        <h3>Tạo tài khoản mới</h3>
        <p>Tham gia cộng động EDUKA để học hỏi, chia sẻ<br> và phát triển cùng nhau!</p>
        <form >
            <div class="icon" >
                <img src="../assets/icons/nguoidung.png" alt="nguoidung">
                <input type="text" placeholder="Họ và tên">
                <p>Vui lòng nhập họ và tên của bạn</p>
                <br>
            </div>
            <div class="icon">
                <img src="../assets/icons/email.png" alt="email">
                <input type="email" placeholder="Email">
                <p>Vui lòng nhập email của bạn</p>
                <br>
            </div>
            <div class="icon">
                <img src="../assets/icons/khoa.png" alt="matkhau">
                <input  type="password" placeholder="Mật khẩu">
                <p>Vui lòng nhập mật khẩu của bạn</p>
                <br>
            </div>
            <div class="icon">
                <img src="../assets/icons/khoa.png" alt="xacnhanmatkhau">
                <input type="password" placeholder="Xác nhận mật khẩu">
                <p>Vui lòng xác nhận mật khẩu của bạn</p>
                <br>
            </div>
            <button><a href="dangnhap.html">Đăng ký</a></button>
        </form>  
        <p class="dang-nhap">Đã có tài khoản? <a href="dangnhap.html">Đăng nhập</a></p>
    </div>
   </main> 
</body>
</html>
